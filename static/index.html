<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphiti Lens</title>
<style>
/* Dark-only by design: this is a local instrument, not a shared page.
   Palette values are the validated dark steps of the reference data-viz palette. */
:root{
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#232322; --surface-3:#2c2c2a;
  --line:#33332f; --line-soft:#282825;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8980; --ink-4:#5f5e58;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --edge-live:#6f6e68;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --r:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--surface-0);color:var(--ink-2);
  font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
#topbar{
  display:flex;align-items:center;gap:14px;padding:0 14px;height:52px;
  background:var(--surface-1);border-bottom:1px solid var(--line);flex-wrap:nowrap;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 3px rgba(57,135,229,.2)}
.brand small{font:400 11px/1 var(--mono);color:var(--ink-4);letter-spacing:0}

.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:var(--r)}
.tabs button{
  background:transparent;border:0;padding:5px 11px;border-radius:5px;cursor:pointer;
  color:var(--ink-3);font-weight:550;font-size:12.5px;white-space:nowrap;
}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface-3);color:var(--ink)}

.field{display:flex;align-items:center;gap:6px}
.field label{font-size:11px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
select,input[type=text],input[type=search]{
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;outline:none;min-width:0;
}
select:focus,input:focus,textarea:focus{border-color:var(--s1);box-shadow:0 0 0 2px rgba(57,135,229,.22)}
#search{width:230px}
.spacer{flex:1}
.btn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:5px 10px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
}
.btn:hover{background:var(--surface-3);color:var(--ink)}
.btn.on{background:rgba(57,135,229,.16);border-color:var(--s1);color:#cfe2fb}
.btn.ghost{background:transparent}

/* ---------- body ---------- */
#body{display:grid;grid-template-columns:300px 1fr 340px;min-height:0}
#body.audit{grid-template-columns:1fr}
#body.audit #left,#body.audit #right,#body.audit #center{display:none}
#audit{min-height:0}
#body.wide-left{grid-template-columns:420px 1fr 340px}
aside{background:var(--surface-1);min-height:0;display:flex;flex-direction:column;overflow:hidden}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.panel-head{
  padding:10px 13px;border-bottom:1px solid var(--line-soft);
  font:600 11px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;
}
.panel-body{overflow:auto;padding:8px;flex:1;min-height:0}
.hint{color:var(--ink-4);padding:16px 13px;font-size:12.5px;line-height:1.65}
.hint kbd{background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font:11px var(--mono);color:var(--ink-2)}

/* ---------- lists ---------- */
.row{
  padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;
  display:block;width:100%;text-align:left;background:transparent;
}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--surface-2);border-color:var(--s1)}
.row .t{color:var(--ink);font-weight:550;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--ink-4);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip{
  display:inline-block;padding:1px 6px;border-radius:4px;background:var(--surface-3);
  color:var(--ink-3);font:500 10.5px/1.6 var(--mono);margin:2px 3px 0 0;white-space:nowrap;
}
.chip.grp{background:rgba(57,135,229,.14);color:#a8cbf5}
.count{font:500 11px var(--mono);color:var(--ink-4)}

/* ---------- canvas ---------- */
#center{position:relative;min-width:0;background:var(--surface-0);overflow:hidden}
#canvas{display:block;width:100%;height:100%;cursor:grab}
#canvas.grabbing{cursor:grabbing}
.hud{position:absolute;display:flex;gap:6px;align-items:center;z-index:3}
.hud.tl{top:12px;left:12px}
.hud.tr{top:12px;right:12px}
.hud.bl{bottom:12px;left:12px;flex-direction:column;align-items:flex-start;gap:8px}
.card{
  background:rgba(26,26,25,.93);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;backdrop-filter:blur(8px);
}
.legend{font-size:11.5px;min-width:186px}
.legend h4{margin:0 0 7px;font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.legend .li{display:flex;align-items:center;gap:8px;padding:2.5px 0;color:var(--ink-2)}
.legend .sw{width:13px;height:13px;border-radius:50%;flex:none}
.legend .sw.sq{border-radius:3px}
.legend svg{flex:none}
#stats{font:500 11.5px var(--mono);color:var(--ink-3)}
#tooltip{
  position:absolute;z-index:9;pointer-events:none;max-width:330px;display:none;
  background:rgba(18,18,17,.97);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-size:12px;color:var(--ink-2);box-shadow:0 8px 26px rgba(0,0,0,.55);
}
#tooltip .tt{color:var(--ink);font-weight:600;margin-bottom:3px}
#tooltip .tm{color:var(--ink-4);font:11px var(--mono);margin-top:4px}
#empty{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:var(--ink-4);font-size:13px;padding:40px;pointer-events:none;
}
#empty .big{font-size:15px;color:var(--ink-3);margin-bottom:6px}

/* time scrubber */
#timebar{display:flex;align-items:center;gap:9px;min-width:290px}
#asof{width:150px;accent-color:var(--s1)}
#asofLabel{font:500 11.5px var(--mono);color:var(--ink-2);min-width:82px}
input[type=range]{height:16px}

/* ---------- inspector ---------- */
.insp h3{margin:0 0 3px;font-size:15px;color:var(--ink);line-height:1.35;word-break:break-word}
.insp .sub{color:var(--ink-4);font:11px var(--mono);margin-bottom:10px;word-break:break-all}
.insp section{border-top:1px solid var(--line-soft);padding:11px 0}
.insp section:first-of-type{border-top:0}
.insp h5{margin:0 0 7px;font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--ink-4)}
.kv dd{margin:0;color:var(--ink-2);font:11.5px var(--mono);word-break:break-word}
.prose{font-size:12.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.fact{
  padding:7px 9px;border-radius:6px;background:var(--surface-2);margin-bottom:6px;
  border-left:2px solid var(--edge-live);cursor:pointer;
}
.fact:hover{background:var(--surface-3)}
.fact.invalidated{border-left-color:var(--warning)}
.fact.expired{border-left-color:var(--critical)}
.fact .f{font-size:12px;color:var(--ink-2);line-height:1.5}
.fact .m{font:10.5px var(--mono);color:var(--ink-4);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.state{font:600 10px var(--sans);letter-spacing:.05em;text-transform:uppercase}
.state.live{color:var(--ink-4)} .state.invalidated{color:var(--warning)} .state.expired{color:var(--critical)}

/* ---------- audit ---------- */
#audit{overflow:auto;padding:20px 24px 60px;background:var(--surface-0)}
.aud-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.aud-head h2{margin:0;font-size:18px;color:var(--ink);font-weight:650;letter-spacing:-.01em}
.aud-head .m{font:11.5px var(--mono);color:var(--ink-4)}
.grid{display:grid;gap:12px}
.grid.tiles{grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(410px,1fr));margin-top:12px}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:9px;padding:14px 15px}
.tile .lbl{font-size:12px;color:var(--ink-3);line-height:1.4;min-height:34px}
.tile .val{font:650 27px/1.1 var(--sans);color:var(--ink);letter-spacing:-.02em;margin:8px 0 2px}
.tile .val span{font-size:14px;color:var(--ink-4);font-weight:500;margin-left:2px}
.tile .det{font-size:11.5px;color:var(--ink-4);margin-top:6px;line-height:1.45}
.meter{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;border-radius:3px}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase}
.badge .g{width:8px;height:8px;border-radius:50%;flex:none}
.badge.good{color:var(--good)} .badge.warning{color:var(--warning)} .badge.critical{color:var(--critical)} .badge.not_measured{color:var(--ink-4)}
.card2{background:var(--surface-1);border:1px solid var(--line);border-radius:9px;padding:15px 16px}
.card2 h3{margin:0 0 3px;font-size:13.5px;color:var(--ink);font-weight:620}
.card2 .cap{font-size:11.5px;color:var(--ink-4);margin-bottom:13px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font:600 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);padding:0 8px 7px 0;border-bottom:1px solid var(--line-soft)}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.n{font:12px var(--mono);text-align:right;padding-right:0}
.stackbar{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface-1);margin:4px 0 10px}
.stackbar i{display:block;height:100%}
.slegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.slegend b{color:var(--ink);font-weight:600;font-family:var(--mono)}
.slegend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- cypher ---------- */
#cy{display:flex;flex-direction:column;height:100%;min-height:0}
#cyq{
  flex:none;height:158px;resize:vertical;background:var(--surface-0);border:1px solid var(--line);
  border-radius:6px;padding:9px;font:12.5px/1.6 var(--mono);color:#dfe6ee;outline:none;width:100%;
}
.cyrow{display:flex;gap:6px;align-items:center;padding:8px 0;flex-wrap:wrap}
#cyerr{color:var(--critical);font:11.5px/1.5 var(--mono);padding:6px 9px;background:rgba(208,59,59,.09);border-radius:5px;display:none;word-break:break-word}
.snips{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.snips button{
  text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
  padding:6px 9px;cursor:pointer;font-size:11.5px;color:var(--ink-3);
}
.snips button:hover{border-color:var(--s1);color:var(--ink-2)}
#cytable{overflow:auto;flex:1;min-height:0;margin-top:8px}
#cytable td{font:11.5px var(--mono);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{padding:16px 13px;color:var(--ink-4);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="dot"></span>Graphiti Lens <small id="conn">connecting…</small></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-mode="explore"  aria-selected="true">Explore</button>
      <button role="tab" data-mode="audit"    aria-selected="false">Audit</button>
      <button role="tab" data-mode="bridges"  aria-selected="false">Bridges</button>
      <button role="tab" data-mode="episodes" aria-selected="false">Episodes</button>
      <button role="tab" data-mode="cypher"   aria-selected="false">Cypher</button>
    </nav>
    <div class="field"><label for="group">Group</label><select id="group"></select></div>
    <div class="field" id="searchField">
      <input type="search" id="search" placeholder="Search entities…  /" autocomplete="off">
      <select id="kind"><option value="entity">entities</option><option value="fact">facts</option><option value="episode">episodes</option></select>
    </div>
    <div class="spacer"></div>
    <div class="hud card" id="timebar" style="position:static;background:transparent;border:0;padding:0">
      <button class="btn" id="asofToggle" title="Filter the graph to the facts that were live on a chosen date">As of: off</button>
      <input type="range" id="asof" min="0" max="1000" value="1000" disabled aria-label="As-of date">
      <span id="asofLabel">—</span>
    </div>
    <button class="btn" id="hideSuper" title="Remove superseded and retracted facts from the canvas">Hide superseded</button>
  </header>

  <div id="body">
    <aside id="left">
      <div class="panel-head"><span id="leftTitle">Results</span><span class="count" id="leftCount"></span></div>
      <div class="panel-body" id="leftBody"></div>
    </aside>

    <main id="center">
      <canvas id="canvas"></canvas>
      <div class="hud tl card" id="stats">—</div>
      <div class="hud tr">
        <button class="btn" id="fit" title="Fit graph to view (F)">Fit</button>
        <button class="btn" id="pause" title="Pause / resume layout (Space)">Pause</button>
      </div>
      <div class="hud bl">
        <div class="card legend" id="legend"></div>
      </div>
      <div id="tooltip"></div>
      <div id="empty"><div><div class="big">Nothing on the canvas yet</div><div id="emptyHint">Search for an entity, or pick a group to load it.</div></div></div>
    </main>

    <aside id="right">
      <div class="panel-head"><span>Inspector</span><span class="count" id="rightCount"></span></div>
      <div class="panel-body insp" id="rightBody"><div class="hint">Click a node or a fact to inspect it.<br><br><kbd>double-click</kbd> a node to expand its neighbours.<br><kbd>/</kbd> search &nbsp; <kbd>F</kbd> fit &nbsp; <kbd>Space</kbd> pause &nbsp; <kbd>Esc</kbd> clear</div></div>
    </aside>

    <div id="audit" hidden></div>
  </div>
</div>
<script src="vendor/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
